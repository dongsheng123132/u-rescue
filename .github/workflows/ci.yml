name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 零依赖，没有 npm install 这一步 —— 这是刻意的：病例库要能 clone 下来直接跑。
      - name: 校验全部病例
        run: node scripts/validate.mjs

      - name: 冒烟测试（CLI 真跑一遍）
        run: node scripts/smoke.mjs

      - name: 生成产物（确认三个消费端都不炸）
        run: |
          node scripts/build-site.mjs
          node scripts/build-skill.mjs

  # 病例会过期。每周提醒一次哪些该复核了，而不是等它们悄悄烂掉。
  staleness:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 列出超期未复核的病例
        run: node scripts/validate.mjs 2>&1 | grep -A100 '提醒' || echo "没有超期病例"
